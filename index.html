            <section>
                <div class="yellow-background w3-center">
                    <h1>Gallery</h1>
                </div>

                            <!-- Images used to open the lightbox -->
                <div class="w3-row w3-container">
                    <div class="w3-col s12 m6 l4">
                        <img src="assets/Icon-Letterform-thumbnail.jpg" alt="Icon Letterform" onclick="openModal();currentSlide(1)" class="hover-shadow w3-image gallery-img">
                    </div>
                    <div class="w3-col s12 m6 l4">
                        <img src="assets/Poster-thumbnail.jpg" alt="Quote Poster" onclick="openModal();currentSlide(2)" class="hover-shadow w3-image gallery-img">
                    </div>
                    <div class="w3-col s12 m6 l4">
                        <img src="assets/Graphic_Design_Principles_II-Letterform-thumbnail.jpg"  alt="Letterform" onclick="openModal();currentSlide(3)" class="hover-shadow w3-image gallery-img">
                    </div>

                    <div class="w3-col s12 m6 l4">
                        <img src="assets/Creese_Melissa-Motion-Animation-thumbnail.jpg" alt="Quote Animation" onclick="openModal();currentSlide(4)" class="hover-shadow w3-image gallery-img">
                    </div>
                    <div class="w3-col s12 m6 l4">
                        <img src="assets/Figureground-Reversal-thumbnail.jpg" alt="Figureground Reversal" onclick="openModal();currentSlide(5)" class="hover-shadow w3-image gallery-img">
                    </div>
                    <div class="w3-col s12 m6 l4">
                        <img src="assets/Graphic_Design_Principles_I-Texture_Value-thumbnail.jpg" alt="Texture" onclick="openModal();currentSlide(6)" class="hover-shadow w3-image gallery-img">
                    </div>
                    <div class="w3-col s12 m6 l4">
                        <img src="assets/Music-Website-thumbnail.jpg" alt="Music Website" onclick="openModal();currentSlide(7)" class="hover-shadow w3-image gallery-img">
                    </div>
                    <div class="w3-col s12 m6 l4">
                        <img src="assets/Pattern-thumbnail.jpg" alt="Pattern" onclick="openModal();currentSlide(8)" class="hover-shadow w3-image gallery-img">
                    </div>
                </div>

                        <!-- The Modal/Lightbox -->
                <div id="myModal" class="modal">
                    <span class="close cursor" onclick="closeModal()">&times;</span>
                    <div class="modal-content">

                        <div class="mySlides">
                        <div class="numbertext">1 / 8</div>
                        <img src="assets/Icon-Letterform-300dpi.jpg" alt="Icon Letterform" style="width:50%">
                        </div>

                        <div class="mySlides">
                        <div class="numbertext">2 / 8</div>
                        <img src="assets/Poster-300dpi.jpg"  alt="Quote Poster" style="width:40%">
                        </div>

                        <div class="mySlides">
                        <div class="numbertext">3 / 8</div>
                        <img src="assets/Graphic_Design_Principles_II-Letterform-300dpi.jpg" alt="Letterform" style="width:50%">
                        </div>

                        <div class="mySlides">
                        <div class="numbertext">4/ 8</div>
                        <img src="assets/Animation.gif" alt="Quote Animation" style="width:40%">
                        </div>

                        <div class="mySlides">
                        <div class="numbertext">5 / 8</div>
                        <img src="assets/Figureground-Reversal-300dpi.jpg" alt="Figureground Reversal" style="width:40%">
                        </div>


                        <div class="mySlides">
                        <div class="numbertext">6 / 8</div>
                        <img src="assets/Graphic_Design_Principles_I-Texture_Value-thumbnail.jpg" alt="Texture" style="width:50%">
                        </div>


                        <div class="mySlides">
                            <div class="numbertext">7 / 8</div>
                            <img src="assets/Music-Website-300dpi.jpg" alt="Music Website" style="width:50%">
                        </div>



                        <div class="mySlides">
                            <div class="numbertext">8 / 8</div>
                            <img src="assets/Pattern-300dpi.jpg" alt="Pattern" style="width:40%">
                        </div>




                                        <!-- Next/previous controls -->
                        <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
                        <a class="next" onclick="plusSlides(1)">&#10095;</a>

                        <!-- Caption text -->
                        <div class="caption-container">
                            <p id="caption"></p>
                        </div>

                        <!-- Thumbnail image controls -->
                        <div class="w3-row">
                            <article class="w3-col s12">
                                <img class="demo" src="assets/Icon-Letterform-thumbnail.jpg" width="72" onclick="currentSlide(1)" alt="For this project, I had to pick a letter and whatever letter I choose, I have to think of anything that starts with that letter. I picked the letter “B”and I used a lowercase “b.” The object is a bowl."> 
                                

                                <img class="demo" src="assets/Poster-thumbnail.jpg" width="72" onclick="currentSlide(2)" alt="For this project, I had to use the same quote from the alignment project and make a poster with that quote, but no more black and white since I’ve been using those colors the last couple of projects.">

                                <img class="demo" src="assets/Graphic_Design_Principles_II-Letterform-thumbnail.jpg" width="72" onclick="currentSlide(3)" alt="For this project, I had to pick a letter and make it figure to ground. I picked the letter “G” and tilted the “G”. Then, I zoomed it in to see the letter and shape. The shape in both pictures should look like a music note and the “G” should be shown.">
                                

                                <img class="demo" src="assets/Creese_Melissa-Motion-Animation-thumbnail.jpg" width="72" onclick="currentSlide(4)" alt="For this project, I have to use whatever quote I liked from the Graphic Designer I chose and researched and put it in motion. I chose Tibor Kalman and researched his quotes. One of his quotes that I really like was “I’m not as good a writer as I’d like to be; therefore, I like to use images to tell stories.">

                                <img class="demo" src="assets/Figureground-Reversal-thumbnail.jpg" width="72" onclick="currentSlide(5)" alt="This is one of the final three pictures for this project. It has a mix of orange and green lines going in the opposite direction. They’re laying on the red triangles, and they’re laying on the yellow vertical lines.">


                                <img class="demo" src="assets/Graphic_Design_Principles_I-Texture_Value-thumbnail.jpg" width="72" onclick="currentSlide(6)" alt="For this project, I had to pick a poem given by my professor and make a cover that fits with that poem. The poem I chose was called “I Have Folded My Sorrows” by Bob Kaufman. In his poem, he mentioned “gray unicorn” and “gray skies.”">

                                <img class="demo" src="assets/Music-Website-thumbnail.jpg" width="72" onclick="currentSlide(7)" alt="For this project, I had to make a website that could be a song lyric, a poem or an article.">

                                <img class="demo" src="assets/Pattern-thumbnail.jpg" width="72" onclick="currentSlide(8)" alt="For this project, I just did a tunnel with two chickens going in one direction and two other chickens going in another direction. There are layers of dirt and the circles which are holes in the dirt.">
                            </article>
                        </div>

                    </div>
                </div>
