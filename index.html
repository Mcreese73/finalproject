      <img class="demo" src="assets/Icon-Letterform-thumbnail.jpg" width="72px" onclick="currentSlide(1)" alt="Icon-Letterform <br> For this project, I had to pick a letter and whatever letter I choose, I have to think of anything that starts with that letter. I picked the letter “B”and I used a lowercase “b.” The object is a bowl.">
      <img class="demo" src="assets/Poster-thumbnail.jpg" width="72px" onclick="currentSlide(2)" alt="<b>Poster</b><br>For this project, I had to use the same quote from the alignment project and make a poster with that quote, but no more black and white since I’ve been using those colors the last couple of projects.</p>">
     <img class="demo" src="assets/Icon-Letterform-thumbnail.jpg" width="72px" onclick="currentSlide(3)" alt="<b>Letterform</b><br>For this project, I had to pick a letter and make it figure to ground. I picked the letter “G” and tilted the “G”. Then, I zoomed it in to see the letter and shape. The shape in both pictures should look like a music note and the “G” should be shown.</p>">
      <img class="demo" src="assets/Creese_Melissa-Motion-Animation-thumbnail.jpg" width="72px" onclick="currentSlide(4)" alt="<b>Animation</b><br>For this project, I have to use whatever quote I liked from the Graphic Designer I chose and researched and put it in motion. I chose Tibor Kalman and researched his quotes. One of his quotes that I really like was “I’m not as good a writer as I’d like to be; therefore, I like to use images to tell stories.</p>">
      <img class="demo" src="assets/Figureground -Reversal -thumbnail.jpg" width="72px" onclick="currentSlide(5)" alt="<b>Figureground Reversal</b><br>The third picture has a mix of orange and green lines going in the opposite direction. They’re laying on the red triangles, and they’re laying on the yellow vertical lines.</div>">
      <img class="demo" src="assets/Graphic Design Principles I-Texture Value-thumbnail.jpg" width="72px" onclick="currentSlide(6)" alt="<b>Texture</b><br>For this project, I had to pick a poem given by my professor and make a cover that fits with that poem. The poem I chose was called “I Have Folded My Sorrows” by Bob Kaufman. In his poem, he mentioned “gray unicorn” and “gray skies.”</p>">
      <img class="demo" src="assets/Music-Website-thumbnail.jpg" width="72px" onclick="currentSlide(7)" alt="<b>Music Website</b><br>For this project, I had to make a website that could be a song lyric, a poem or an article.</p>">
      <img class="demo" src="assets/Pattern-thumbnail.jpg" width="72px" onclick="currentSlide(8)" alt="<p><b>Pattern Project</b>For this project, I just did a tunnel with two chickens going in one direction and two other chickens going in another direction. There are layers of dirt and the circles which are holes in the dirt.</p>">
